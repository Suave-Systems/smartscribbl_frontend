<header class="flex items-center justify-between p-2 bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="flex items-center gap-2">
    <!-- Mobile hamburger -->
    <button type="button" class="md:hidden p-2 rounded hover:bg-gray-100 focus:outline-none focus:ring"
      (click)="toggleSidebar.emit()" aria-label="Open menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <h1 class="text-lg md:text-xl font-semibold text-primary text-nowrap">
      {{currentPageTitle}}
    </h1>
  </div>

  <button [matMenuTriggerFor]="menu"
    class="cursor-pointer group rounded-full px-2 py-1 bg-gray-300 flex items-center gap-2 overflow-hidden transition-all duration-300">
    <span class="rounded-full bg-white p-1 transform transition-transform duration-300 group-hover:-translate-x-1">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M5.121 17.804A9 9 0 0112 15a9 9 0 016.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </span>
  </button>
</header>

<mat-menu #menu="matMenu">
  <button mat-menu-item [routerLink]="['/main/user-profile']" routerLinkActive="router-link-active">
    View Profile
  </button>
  <button mat-menu-item [routerLink]="['/main/change-password']" routerLinkActive="router-link-active">
    Change Password
  </button>
</mat-menu>
