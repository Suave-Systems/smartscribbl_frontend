<div class="flex justify-center h-full">
  <div class="w-full px-4 md:px-0 max-w-md flex flex-col justify-center items-center gap-y-4">
    <p class="font-bold text-[2rem]/[2.25rem] text-center text-primary">
      Sign Up
    </p>

    <p class="text-center text-grey text-[1rem]/[1.5rem]">
      Start your journey
    </p>
    @if (errorMessage) {
    <p class="text-center text-[#F66E6E] text-grey text-[1rem]/[1.5rem]">
      {{errorMessage}}
    </p>
    }
    <app-input [control]="firstName" class="w-full" label="First Name" placeholder="Enter your First Name"></app-input>
    <app-input [control]="lastName" class="w-full" label="Last Name" placeholder="Enter your Last Name"></app-input>
    <app-input type="email" [control]="email" class="w-full" label="Email" placeholder="Enter your email"></app-input>
    <div class="w-full">
      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <div class="relative">
        <input
          class="w-full border border-gray-300 rounded-md px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-primary"
          [type]="hide() ? 'password' : 'text'" formControlName="password" autocomplete="current-password"
          spellcheck="false" placeholder="Enter your password" aria-describedby="password-help" />
        <button type="button" class="absolute inset-y-0 right-0 px-3 flex items-center" (click)="hide.set(!hide())"
          [attr.aria-label]="hide() ? 'Show password' : 'Hide password'"
          [attr.title]="hide() ? 'Show password' : 'Hide password'">
          @if (hide()) {
          <!-- Eye icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="h-5 w-5">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          } @else {
          <!-- Eye-off icon -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            class="h-5 w-5">
            <path
              d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.28 20.28 0 0 1-3.23 4.62" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
          }
        </button>
      </div>
      @if (password.touched && password.invalid) {
      <p id="password-help" class="text-xs text-[#F66E6E] mt-1">Password is required</p>
      }
    </div>
    <!-- <app-input type="password" [control]="password" class="w-full" label="Password"
      placeholder="Enter your password"></app-input> -->
    <app-button [buttonDisabled]="isLoading()" [loading]="isLoading()" (buttonClick)="signUp()" inputClass="!w-full"
      class="w-full">Get
      Started</app-button>
    <p class="text-center text-grey">
      Already have an account?
      <span [routerLink]="['/auth/login']" routerLinkActive="router-link-active" class="cursor-pointer text-primary">
        Log in
      </span>
    </p>
  </div>
</div>
