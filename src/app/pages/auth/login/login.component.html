<div class="flex justify-center h-full">
  <div class="w-full px-4 md:px-0 max-w-md flex flex-col justify-center  gap-y-4">
    <p class="font-bold text-[2rem]/[2.25rem] text-center text-primary">
      Login
    </p>

    <p class="text-center text-grey text-[1rem]/[1.5rem]">
      Continue your journey
    </p>
    @if (errorMessage) {
    <p class="text-[#F66E6E] text-center text-[1rem]/[1.5rem]">
      {{errorMessage}}
    </p>
    }
    <ng-container [formGroup]="loginForm">
      <app-input [control]="email" class="w-full" label="Email" placeholder="Enter your email"></app-input>
      <div class="w-full">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input
            class="w-full border border-gray-300 rounded-md px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-primary"
            [type]="hide() ? 'password' : 'text'" formControlName="password" autocomplete="current-password"
            spellcheck="false" placeholder="Enter your password" aria-describedby="password-help" />
          <button type="button" class="absolute inset-y-0 right-0 px-3 flex items-center" (click)="hide.set(!hide())"
            [attr.aria-label]="hide() ? 'Show password' : 'Hide password'"
            [attr.title]="hide() ? 'Show password' : 'Hide password'">
            @if (hide()) {
            <!-- Eye icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" class="h-5 w-5">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            } @else {
            <!-- Eye-off icon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" class="h-5 w-5">
              <path
                d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.28 20.28 0 0 1-3.23 4.62" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            }
          </button>
        </div>
        @if (password.touched && password.invalid) {
        <p id="password-help" class="text-xs text-[#F66E6E] mt-1">Password is required</p>
        }
      </div>
      <p [routerLink]="['/auth/forgot-password']" routerLinkActive="router-link-active"
        class="text-end text-sm text-primary">Forgot
        Password?</p>
      <app-button [buttonDisabled]="isLoading()" [loading]="isLoading()" (buttonClick)="onLogin()" inputClass="!w-full"
        class="w-full">Login</app-button>
    </ng-container>

    <p class="text-center text-grey">
      Don't have an account?
      <span [routerLink]="['/auth/signup']" routerLinkActive="router-link-active" class="cursor-pointer text-primary">
        Sign Up
      </span>
    </p>
  </div>
</div>
